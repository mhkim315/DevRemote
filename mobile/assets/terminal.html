<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<link rel="stylesheet" href="xterm.css" />
<script src="xterm.js"></script>
<style>
*{margin:0;padding:0}html,body{width:100%;height:100%;background:#000}#t{width:100%;height:100%}
</style>
</head>
<body><div id="t"></div>
<script>
var t=new Terminal({fontSize:12,fontFamily:'Menlo,Monaco,"Courier New",monospace',theme:{background:'#000',foreground:'#ccc'},scrollback:10000});
t.open(document.getElementById('t'));
var ws=new WebSocket('ws://10.0.2.2:9171/term/ws');
ws.onmessage=function(e){t.write(e.data)};
t.onData(function(d){ws.send(d)});
setTimeout(function(){try{t.textarea.focus()}catch(e){}},500);
</script>
</body>
</html>
