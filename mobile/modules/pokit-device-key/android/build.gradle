plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pokitdevicekey'

android {
  namespace "expo.modules.pokitdevicekey"
  defaultConfig {
    compileSdk 35
    minSdk 24
    targetSdk 35
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
